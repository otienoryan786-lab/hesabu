<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d30">
  <meta name="description" content="Hesabu: the shared daily record for vehicle owners and drivers.">
  <title>Hesabu — Daily records</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <a class="skip-link" href="#app">Skip to app content</a>
  <header class="top">
    <a class="brand" href="index.html" aria-label="Hesabu home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="10" fill="currentColor"/><path d="M9 8v15M14.5 8v15M20 8v15" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="m6 21 6 4 14-14" stroke="#f3bb55" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>hesabu<span class="brand-period">.</span></span>
    </a>
    <div class="ctrl">
      <button id="role" class="pill" type="button" aria-label="Switch owner or driver view"></button>
      <button id="mode" class="pill" type="button" aria-label="Switch demo or personal data"></button>
    </div>
  </header>
  <main id="app" aria-live="polite" aria-busy="false"></main>
  <div id="sheet" class="sheet" hidden></div>
  <script src="app.js"></script>
  <script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
